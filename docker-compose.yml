version: '3.8'

services:
  ugrck-kernel-worker:
    build: .
    image: ugrck-core:latest
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    networks:
      - ugrck_cybernetic_network

  nginx-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "8080:8080"
    depends_on:
      - ugrck-kernel-worker
    networks:
      - ugrck_cybernetic_network

networks:
  ugrck_cybernetic_network:
    driver: bridge
