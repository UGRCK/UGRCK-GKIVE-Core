events {
    worker_connections 4096;
}

http {
    upstream ugrck_cluster {
        server ugrck-kernel-worker:8080;
    }

    server {
        listen 80;
        listen 8080;

        location / {
            proxy_pass http://ugrck_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
